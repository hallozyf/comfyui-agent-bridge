[project]
name = "comfyui-agent-bridge"
version = "1.2.0"
description = "DSH (DeepSeek Harness) plugin: agent-friendly REST endpoints for ComfyUI, text-to-image in one HTTP call"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["comfyui", "dsh", "dsh-plugins", "deepseek-harness", "agent", "llm", "text-to-image", "api", "rest", "flux", "sdxl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/hallozyf/comfyui-agent-bridge"
Issues = "https://github.com/hallozyf/comfyui-agent-bridge/issues"

[tool.comfy]
PublisherId = ""
DisplayName = "ComfyUI Agent Bridge"
Icon = ""
requires-comfyui = ">=0.3.0"
